<style>
:root{--bg:#F4F3F1;--card:#fff;--line:#111112;--ink:#111112;--mut:#6c6e63;--gold:#FFD400;--gold2:#111112;--teal:#1f7a52;--rose:#c92f45;--lime:#FFD400;--pink:#F4F3F1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111112;color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.dk{--ink:#F4F3F1;--mut:#b4b5a8;--gold2:#FFD400;--line:#ffffff33;--teal:#8de6bd;--rose:#ff7d8f;color:#F4F3F1}
.stage{height:100%;display:flex;align-items:center;justify-content:center;background:#050505}
#app{position:relative;width:100%;height:100%;max-width:430px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:700px){#app{height:min(880px,96vh);border-radius:36px;border:6px solid #111112;box-shadow:0 0 0 2px #FFD400,0 40px 90px -20px #000}}
.disp{font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
header.top{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg);border-bottom:2px solid var(--ink)}
.brand{font-size:21px;line-height:1;display:flex;align-items:center;gap:8px}.brand:before{content:"";width:16px;height:16px;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;background:#fff;font-weight:700;font-size:12.5px;border:2px solid var(--ink)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 90px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.pad{height:0}
nav.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#111112;padding:8px 6px 12px;z-index:8}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#9d9e92;padding:6px 0 3px;letter-spacing:.04em;text-transform:uppercase;border-radius:14px;transition:.2s}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:#111112;background:var(--lime)}
h2.sec{font-size:26px;margin:34px 18px 14px;display:flex;justify-content:space-between;align-items:center;line-height:1}
h2.sec small{font-family:'Inter Tight';font-stretch:100%;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink);font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:4px 11px;background:#fff}
.row{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:0 18px 6px;scrollbar-width:none;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.poster{position:relative;color:var(--pf);flex:none;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--pb,#111112);display:flex;flex-direction:column;justify-content:space-between;padding:14px;border:2px solid #111112;transition:transform .25s}
.poster svg.art{position:absolute;inset:0;width:100%;height:100%}
.poster .pbg{position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,var(--pf) 0 14%,transparent 15%),repeating-linear-gradient(135deg,transparent 0 14px,rgba(128,128,128,.12) 14px 16px);opacity:.9}.poster img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:none;z-index:1}.poster.has .pt,.poster.has .pl,.poster.has .pbg{display:none}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15)}

.poster .pt{position:relative;z-index:2;font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;text-transform:uppercase;font-size:21px;line-height:.9;color:var(--pf,#FFD400);letter-spacing:-.03em;word-break:break-word}
.poster .pl{position:relative;z-index:2;font-size:9.5px;font-weight:800;color:var(--pf,#FFD400);letter-spacing:.14em;text-transform:uppercase;align-self:flex-start;padding:3px 7px;border:1.5px solid var(--pf,#FFD400);border-radius:99px}
.p-s{width:146px}.p-s .pt{font-size:17px}
.mcard{width:146px;flex:none;text-align:left;scroll-snap-align:start}
.mcard:active .poster{transform:scale(.97)}
.mcard .mt{font-weight:800;margin-top:10px;font-size:14px;line-height:1.2}
.mcard .ms{font-size:12.5px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:5px}
.star{display:inline-block;width:13px;height:13px;background:var(--lime);border:1.5px solid var(--ink);clip-path:none;border-radius:50%}
.pct{color:var(--teal);font-weight:800}
.hero{position:relative;height:520px;overflow:hidden;background:#111112}
.hero .poster{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;border:0}
.hero .blob{position:absolute;left:0;top:0;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;background:var(--lime);mix-blend-mode:difference;pointer-events:none;z-index:2;filter:blur(1px);will-change:transform}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#111112 6%,transparent 58%);z-index:1;pointer-events:none}
.hero .cap{position:absolute;left:18px;right:18px;bottom:22px;z-index:3}
.hero .cap .k{display:inline-block;background:var(--lime);color:#111112;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;padding:5px 10px;border-radius:99px}
.hero .cap h1{font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;text-transform:uppercase;font-size:44px;line-height:.9;margin:12px 0;letter-spacing:-.03em}
.hero .cap p{margin:0 0 16px;color:#d9dacd;font-size:14px;line-height:1.45;max-width:330px}
.marq{background:var(--lime);border-block:2px solid var(--ink);overflow:hidden;white-space:nowrap;padding:9px 0}
.marq div{display:inline-block;animation:mq 22s linear infinite;font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:-.01em}
@keyframes mq{to{transform:translateX(-50%)}}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:99px;background:var(--lime);color:#111112;font-weight:800;border:2px solid #111112;overflow:hidden;transition:color .25s,transform .1s;z-index:0}
.btn:before{content:"";position:absolute;inset:0;background:#111112;transform:translateY(101%);transition:transform .28s cubic-bezier(.7,0,.2,1);z-index:-1}
.btn:hover,.btn:active{color:var(--lime)}.btn:hover:before,.btn:active:before{transform:none}
.dk .btn{border-color:#F4F3F1}.dk .btn:before{background:#F4F3F1}.dk .btn:hover,.dk .btn:active{color:#111112}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover,.btn.ghost:active{color:var(--bg)}
.dk .btn.ghost{color:#F4F3F1}.dk .btn.ghost:hover,.dk .btn.ghost:active{color:#111112}
.btn.teal{background:#fff}.btn.block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.stub{background:#fff;color:#111112;border-radius:16px;padding:16px 18px;position:relative;border:2px solid #111112}
.stub .t{font-weight:800;font-size:16px;letter-spacing:-.01em}.stub .m{font-size:12.5px;color:var(--mut);margin-top:3px}
.stub.dk{background:#111112;border-color:#111112;color:#F4F3F1}.stub.dk .bar{background:#2a2b27;border-color:#F4F3F1}
.stubwrap{margin:0 18px 12px}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid currentColor}
.tag.g{background:var(--lime);color:#111112;border-color:#111112}.tag.t{background:#fff;color:var(--teal)}.tag.r{color:var(--rose)}.tag.p{color:var(--ink)}
.av{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#111112;flex:none;border:2px solid #111112;font-family:'Inter Tight',Inter,sans-serif;font-size:16px}
.list{margin:0 18px;display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:15px 0;border-bottom:2px solid var(--ink)}
.item:first-child{border-top:2px solid var(--ink)}
.item .b{flex:1;min-width:0}.item .n{font-weight:800;font-size:15.5px}.item .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.seg{display:flex;margin:12px 18px 8px;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:3px}
.seg button{flex:1;padding:9px 4px;font-weight:800;color:var(--ink);font-size:13px;border-radius:99px;transition:.2s}.seg button.on{background:#111112;color:var(--lime)}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid var(--ink)}
.sheet .sh .x{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-size:22px;line-height:1}
.sheet .sh .ttl{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{flex:1;overflow-y:auto;padding-bottom:30px;display:flex;flex-direction:column}.sheet .body>*{flex-shrink:0}
.sheet .foot{padding:12px 18px 22px;border-top:2px solid var(--ink);background:var(--bg)}
.mhead{position:relative;height:300px;background:#111112}
.mhead .poster{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;border:0}
.mhead:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#111112 0%,transparent 62%);pointer-events:none}
.mhead .cap{position:absolute;left:18px;right:18px;bottom:18px;z-index:3}
.mhead h1{font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;text-transform:uppercase;font-size:34px;line-height:.92;margin:0 0 8px;letter-spacing:-.03em}
.score{display:flex;align-items:center;gap:10px;margin:16px 18px 0}
.score .n{font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;font-size:40px;line-height:1;letter-spacing:-.03em}
.score .n small{font-size:16px;color:var(--mut)}
.score .v{font-size:12px;color:var(--mut);line-height:1.3}
.facts{display:grid;grid-template-columns:1fr 1fr;margin:18px 18px 0;border:2px solid var(--ink);border-radius:16px;background:#fff;overflow:hidden}
.facts div{padding:11px 14px;border-bottom:2px solid var(--ink)}.facts div:nth-child(odd){border-right:2px solid var(--ink)}.facts div:nth-last-child(-n+2){border-bottom:0}
.facts b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.cast{display:flex;gap:14px;overflow-x:auto;padding:0 18px;scrollbar-width:none}.cast::-webkit-scrollbar{display:none}
.cast div{flex:none;width:78px;text-align:center;font-size:12px;font-weight:700;line-height:1.2}.cast span{display:block;color:var(--mut);font-weight:500;margin-top:2px;font-size:11px}
.cast .av{width:64px;height:64px;font-size:22px;margin:0 auto 8px}
.deck{position:relative;height:455px;margin:14px 24px 0;touch-action:none}
.dcard{position:absolute;inset:0;border-radius:16px;overflow:hidden;cursor:grab;user-select:none;transition:transform .25s}
.dcard.drag{transition:none}
.dcard .poster{width:100%;height:100%;border-radius:16px;padding:20px 20px 100px}
.dcard .poster .pt{font-size:44px}
.dcard .info{position:absolute;left:0;right:0;bottom:0;padding:18px;z-index:3}
.stamp{position:absolute;top:26px;z-index:4;font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;text-transform:uppercase;font-size:22px;padding:2px 12px;border:3px solid;border-radius:10px;opacity:0;transform:rotate(-10deg);background:#111112}
.stamp.m{left:18px;color:var(--lime)}.stamp.p{right:18px;color:var(--rose);transform:rotate(10deg)}.stamp.t{left:50%;top:60px;margin-left:-80px;color:#fff}
.acts{display:flex;justify-content:center;gap:18px;margin-top:24px}
.acts button{width:68px;height:68px;border-radius:50%;background:#fff;font-weight:800;font-size:10.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:2px solid #111112;transition:transform .1s}
.acts button:active{transform:scale(.92)}
.acts .m{background:var(--lime)}.acts .p{color:var(--rose)}
.bar{height:10px;border-radius:99px;background:#fff;border:2px solid var(--ink);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.chat{display:flex;flex-direction:column;gap:10px;padding:14px 18px}
.msg{max-width:80%;padding:10px 14px;border-radius:18px 18px 18px 4px;background:#fff;align-self:flex-start;font-size:14px;line-height:1.4;border:2px solid var(--ink)}
.msg b{display:block;font-size:11px;color:var(--mut);margin-bottom:2px;letter-spacing:.04em}
.msg.me{align-self:flex-end;background:var(--lime);border-radius:18px 18px 4px 18px}.msg.me b{display:none}
.inbar{display:flex;gap:8px;padding:10px 16px 20px;border-top:2px solid var(--ink);background:var(--bg)}
.inbar input{flex:1;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:11px 18px;outline:none}
.inbar button{width:46px;height:46px;border-radius:50%;background:#111112;color:var(--lime);font-weight:900;font-size:18px}
.dates{display:flex;gap:8px;overflow-x:auto;padding:6px 18px 10px;scrollbar-width:none}
.dates button{flex:none;padding:9px 15px;border-radius:14px;background:#fff;border:2px solid var(--ink);font-weight:800;font-size:12.5px;text-align:center}.dates button.on{background:#111112;color:var(--lime)}
.thb{margin:8px 18px 20px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.times{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.times button{padding:9px 14px;border-radius:99px;border:2px solid #111112;background:#fff;font-weight:800;font-size:12.5px;transition:.15s}
.times button:hover{background:#111112;color:var(--lime)}.times button.low{background:var(--lime)}
.screen{margin:8px 44px 22px;height:22px;border-radius:50% 50% 0 0/100% 100% 0 0;border-top:4px solid #111112;background:linear-gradient(var(--lime),transparent);text-align:center;font-size:10px;color:var(--ink);font-weight:800;padding-top:5px;letter-spacing:.2em;text-transform:uppercase}
.seats{display:grid;gap:7px;padding:0 18px;justify-content:center}
.seat{width:27px;height:25px;border-radius:7px 7px 3px 3px;background:#fff;border:2px solid #111112;font-size:9px;font-weight:800;color:#111112;transition:.12s}
.seat.sold{background:repeating-linear-gradient(135deg,#d9d8d3 0 3px,#f4f3f1 3px 6px);border-color:#c9c8c1;color:transparent;pointer-events:none}.seat.sel{background:#111112;color:var(--lime)}
.seat.t3{background:#f2ffb8}
.legend{display:flex;justify-content:center;gap:16px;font-size:11.5px;color:var(--mut);margin:18px 0 10px;font-weight:600}
.legend span:before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c);border:2px solid #111112}
.field{margin:14px 18px 0}.field label{display:block;font-size:11px;color:var(--mut);font-weight:800;margin-bottom:7px;letter-spacing:.1em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px;outline:none}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#111112;color:var(--lime);padding:11px 20px;border-radius:99px;font-weight:800;font-size:13px;z-index:60;animation:up .2s;white-space:nowrap;max-width:90%}
.upi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.upi button{padding:14px 4px;border-radius:14px;background:#fff;border:2px solid var(--ink);font-weight:800;font-size:13px}.upi button.on{background:#111112;color:var(--lime)}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--ink)}.sum.tot{font-weight:900;font-size:18px;border-top:2px solid var(--ink);margin-top:8px;padding-top:12px}
.note{margin:14px 18px 0;font-size:12.5px;color:var(--mut);line-height:1.5}
.empty{margin:30px 28px;text-align:center;color:var(--mut);line-height:1.5}
canvas.qr{width:150px;height:150px;image-rendering:pixelated;display:block;margin:14px auto 6px;background:#fff;padding:8px;border-radius:12px}
.spin{width:44px;height:44px;border:4px solid #d9d8d3;border-top-color:#111112;border-radius:50%;animation:rot .8s linear infinite;margin:70px auto 14px}@keyframes rot{to{transform:rotate(360deg)}}
.rank{font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;font-size:34px;width:42px;line-height:1;letter-spacing:-.04em;-webkit-text-stroke:2px #111112;color:transparent}
.sc{font-family:Archivo,Impact,sans-serif;font-stretch:76%;font-weight:900;font-size:17px;background:var(--lime);border:2px solid var(--ink);border-radius:10px;padding:4px 8px}
.rev{margin:0 18px 12px;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px;line-height:1.45;font-size:14px}.rev b{display:flex;justify-content:space-between;margin-bottom:6px}
#intro{position:absolute;inset:0;z-index:100;background:var(--lime);overflow:hidden;transition:transform .8s cubic-bezier(.77,0,.18,1)}
#intro.go{transform:translateY(-101%)}
#intro .word{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;font:900 min(17vw,128px)/.9 Archivo,Impact,sans-serif;font-stretch:76%;text-transform:uppercase;letter-spacing:-.03em;color:#111112;transition:top .7s cubic-bezier(.7,0,.2,1)}
#intro.up .word{top:27%}
#intro .word span{display:inline-block}
#intro .w1{animation:dropIn .6s cubic-bezier(.3,1.35,.5,1) both}

  let L=feedMode==="you"?r:feedMode==="new"?[...r].sort((a,b)=>a.p.h-b.p.h):feedMode==="mine"?[...r].filter(x=>x.p.by===S.name).sort((a,b)=>a.p.h-b.p.h):r.filter(x=>S.fol[x.p.by]);
  if(feedFilm!=="all")L=L.filter(x=>x.p.mv===feedFilm);
  const R=campRank(),films=[...new Set(S.feed.map(p=>p.mv).filter(Boolean))].map(M).filter(Boolean);
  const modes=[["you","For you","Picked from what you like, reply to and follow"],["follow","Following","Only people you follow"],["new","New","Latest first"],["mine","Mine","Only your posts"]];
  const left=`<aside class="fl"><h1 class="disp"><span class="mtag">Much<em class="ser">atlu</em></span></h1><p class="fnote">No city walls. Posts are ranked by likes, replies and age, then boosted by the people you follow, the fans and films you engage with, and films releasing this week.</p>
   <div class="fmodes">${modes.map(([k,l,d])=>`<button class="${feedMode==k?"on":""}" data-m="${k}"><b>${l}</b><span>${esc(d)}</span></button>`).join("")}</div>
   <h4>Film</h4><div class="fchips"><button class="${feedFilm==="all"?"on":""}" data-f="all">All films</button>${films.map(m=>`<button class="${feedFilm===m.id?"on":""}" data-f="${m.id}">${esc(m.t)}</button>`).join("")}</div></aside>`;
  let mid;
  if(feedThread&&S.feed.find(p=>p.id===feedThread)){
    const x=r.find(y=>y.p.id===feedThread);
    mid=`<button class="fback" id="fb">‹ All posts</button>${feedCard(x,9)}<h3 class="disp fthr">Replies</h3><div class="thread" id="thr"><div id="cb"></div></div>`;
  }else{
    mid=`<div class="mobtop"><button class="fback" onclick="go('home')">‹ Home</button><span class="mtag mh">Much<em class="ser">atlu</em></span></div>
    <div class="merow">${av(S.name,46)}<div><b>${esc(S.name)}</b><span>${esc(PL())}${S.camp?" · "+esc(CAMPS.find(c=>c.id===S.camp).n)+" fans":""}</span></div></div>
    <button class="compfake" onclick="newPost()">${av(S.name,34)}<span style="flex:1">${PR()}</span><b>Spill</b></button>
    <div class="comp"><textarea id="fpText" rows="3" maxlength="280" placeholder="${PR()} Name a film and it gets tagged."></textarea>${tagBlock()}${pollBlock()}<div class="compbar"><button class="btn" id="fpGo">Spill it</button></div></div>
    ${suggHTML()}<div class="ftabs">${modes.map(([k,l])=>`<button class="${feedMode==k?"on":""}" data-m="${k}">${l}</button>`).join("")}</div>
    ${L.length?L.map((x,i)=>feedCard(x,i)).join(""):`<div class="empty">${feedMode==="follow"?"You follow nobody yet. Follow a few fans above and their posts land here.":feedMode==="mine"?"You have not posted yet. Spill something.":"Nothing here yet. Be the first to post."}</div>`}`;
  }
  const right=`<aside class="fr"><h3 class="disp">Fan clubs</h3><div class="fclubs">${hotClubs(5).map(c=>`<button onclick="openCamp('${c.id}')"><b>${esc(c.n)}</b><em>${S.camp===c.id?"Yours":c.k+" posts"}</em></button>`).join("")}</div>
   <h3 class="disp" style="margin-top:28px">Going alone?</h3><div class="stub"><div class="m">${(n=>n+(n===1?" person wants":" people want"))(S.solo.filter(x=>x.city===S.city).length)} company in ${PL()}</div><div style="margin-top:10px"><button class="btn" style="padding:10px 18px" onclick="go('meet')">Find company</button></div></div></aside>`;
  $("#view").innerHTML=`<div class="fp">${left}<section class="fm">${mid}</section>${right}</div>`;
  const v=$("#view");
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{feedMode=b.dataset.m;feedThread=null;feedPage()});
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{feedFilm=b.dataset.f;feedThread=null;feedPage()});
  const fb=v.querySelector("#fb");if(fb)fb.onclick=()=>{feedThread=null;feedPage()};
  const cmp=v.querySelector(".comp");if(cmp){pollWire(cmp);tagWire(cmp,v.querySelector("#fpText"))}const g=v.querySelector("#fpGo");if(g)g.onclick=()=>{const tx=v.querySelector("#fpText").value.trim();if(!tx){toast("Write something first");return}const pl=pollRead(cmp);if(pl==="bad"){toast("A poll needs two options");return}addFeedPost(tx,pl,tagRead(cmp));feedPage()};
  if(feedThread&&v.querySelector("#thr")){const p=S.feed.find(x=>x.id===feedThread);mountChat(v.querySelector("#cb"),"post:"+feedThread,[{u:"Sai",t:CAMPBANTER[5]}],v.querySelector("#thr"))}
}

function serifH2(){document.querySelectorAll("#view h2.sec").forEach(h=>{if(h.dataset.s)return;h.dataset.s=1;const n=[...h.childNodes].find(x=>x.nodeType===3&&x.textContent.trim());if(!n)return;const w=n.textContent.trim().split(/\s+/);if(w.length<2)return;const last=w.pop();const sp=document.createElement("span");sp.innerHTML=esc(w.join(" "))+' <em class="ser">'+esc(last)+'</em>';n.replaceWith(sp)})}

/* phone stuck in "Desktop site" mode: lay out as phone, scale to fit */
function fitPhone(){const a=document.getElementById("app");if(!a)return;
  const small=Math.min(screen.width,screen.height)<=600,coarse=matchMedia("(pointer:coarse)").matches;
  if(false){const z=innerWidth/412;Object.assign(a.style,{zoom:z,height:(innerHeight/z)+"px",maxWidth:"none",width:"412px",border:"0",borderRadius:"0",boxShadow:"none"});document.body.classList.add("phonewide")}
  else{["zoom","height","maxWidth","width","border","borderRadius","boxShadow"].forEach(k=>a.style[k]="");document.body.classList.remove("phonewide")}}
fitPhone();addEventListener("resize",fitPhone);
/* ---- PWA ---- */
let DP=null;
const STANDALONE=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
if(STANDALONE)document.body.classList.add("installed");
async function installApp(){
  document.querySelector(".inst")?.remove();
  if(DP){DP.prompt();await DP.userChoice;DP=null;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  sheet("Install Interval",ios?
   `<div style="padding:22px 20px;line-height:1.7"><p><b>1.</b> Tap the Share button at the bottom of Safari.</p><p><b>2.</b> Scroll and tap <b>Add to Home Screen</b>.</p><p><b>3.</b> Tap Add. Open Interval from your home screen.</p><p style="color:var(--mut);font-size:13px">On iPhone this only works in Safari.</p></div>`:
   `<div style="padding:22px 20px;line-height:1.7"><p><b>1.</b> Tap the three dots menu at the top right of Chrome.</p><p><b>2.</b> Tap <b>Install app</b> or <b>Add to Home screen</b>.</p><p><b>3.</b> Open Interval from your home screen.</p></div>`)}
(function(){
  if("serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
  document.addEventListener("click",e=>{if(e.target.closest("button")&&navigator.vibrate)navigator.vibrate(8)},true);
  const off=()=>document.getElementById("off").classList.toggle("on",!navigator.onLine);addEventListener("online",off);addEventListener("offline",off);off();
  try{const g=new URLSearchParams(location.search).get("go");if(g&&["home","book","camps","meet","me"].includes(g))setTimeout(()=>go(g==="book"?"seats":g),900)}catch(e){}
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;later()});
  addEventListener("appinstalled",()=>{document.body.classList.add("installed");document.querySelector(".inst")?.remove()});
  function later(){if(STANDALONE||S.noinst||document.querySelector(".inst"))return;setTimeout(()=>{if(document.querySelector(".inst")||document.body.classList.contains("installed"))return;const b=document.createElement("div");b.className="inst";
    b.innerHTML='<div><b>Get the Interval app</b><span>Full screen. Works offline.</span></div><button class="go">Install</button><button class="no" aria-label="Close">×</button>';
    document.getElementById("app").appendChild(b);
    b.querySelector(".no").onclick=()=>{S.noinst=1;save();b.remove()};b.querySelector(".go").onclick=installApp},4500)}
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))later();
})();
